<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Panic — Local AI Study Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #171717;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 42px;
    }

    .header p {
      color: #666;
      font-size: 17px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea,
    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #333;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-top: 15px;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🎓 Exam Panic</h1>
      <p>Your local AI study planner powered by QVAC</p>
    </div>

    <div class="card">

      <label>📚 Your Subjects / Topics</label>

      <textarea
        id="topics"
        placeholder="Example:
Data Structures - Trees, AVL, Heap
C++ - Inheritance, Polymorphism
Mathematics - Probability, Statistics">
      </textarea>

      <div class="row">

        <div>
          <label>⏰ Hours Available</label>
          <input id="hours" type="number" min="1" placeholder="Example: 6">
        </div>

        <div>
          <label>🎯 Preparation Level</label>

          <select id="level">
            <option value="beginner">Beginner</option>
            <option value="average">Average</option>
            <option value="strong">Strong</option>
          </select>
        </div>

      </div>

      <button onclick="generatePlan()">
        🚀 Generate My Study Plan
      </button>

      <div class="status" id="status">
        AI runs locally on your device.
      </div>

    </div>

    <div class="card">

      <h2>📋 Your AI Study Plan</h2>

      <div id="result">
        Your personalized study plan will appear here.
      </div>

    </div>

  </div>

  <script>
    async function generatePlan() {

      const topics = document.getElementById("topics").value;
      const hours = document.getElementById("hours").value;
      const level = document.getElementById("level").value;

      if (!topics.trim() || !hours) {
        alert("Please enter your topics and available hours.");
        return;
      }

      const status = document.getElementById("status");
      const result = document.getElementById("result");

      status.textContent = "Creating your local AI study plan...";
      result.textContent = "Thinking...";

      try {

        const response = await fetch("/api/plan", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            topics,
            hours,
            level
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        result.textContent = data.plan;
        status.textContent = "✓ Plan generated locally with QVAC";

      } catch (error) {

        result.textContent = "Error: " + error.message;
        status.textContent = "Something went wrong.";

      }
    }
  </script>

</body>
</html>
